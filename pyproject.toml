[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chaff"
version = "0.3.0"
description = "Add realistic decoy propeller flyovers to a recording so that locating it by matching aircraft Doppler curves to flight tracks cannot trust what it finds."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrew Medrano" }]
requires-python = ">=3.10"
keywords = ["privacy", "acoustics", "doppler", "ads-b", "geolocation", "audio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Security",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "soundfile>=0.12"]

[project.optional-dependencies]
detect = ["dopplertrack>=0.3; python_version >= '3.12'"]   # dopplertrack needs Python 3.12+
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/andrew-medrano/chaff"
Source = "https://github.com/andrew-medrano/chaff"
Issues = "https://github.com/andrew-medrano/chaff/issues"

[project.scripts]
chaff = "chaff.cli:entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chaff = ["data/mcmaster.npz", "data/README.md"]   # the bundled catalog and its credit

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["slow: takes more than ~10 s (real flyover detection, the memory check); skip with -m 'not slow'"]
